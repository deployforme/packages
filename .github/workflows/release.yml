name: Hivelet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hivelet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        run: corepack enable

      - name: Use workspace pnpm version
        run: pnpm --version | grep -E "^10\." || (echo "Wrong pnpm version" && exit 1)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  release:
    name: Publish packages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack packages
        working-directory: packages/core
        run: pnpm pack --pack-destination ../dist

      - name: Pack express adapter
        working-directory: packages/adapter-express
        run: pnpm pack --pack-destination ../dist

      - name: Pack nest adapter
        working-directory: packages/adapter-nest
        run: pnpm pack --pack-destination ../dist

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: hivelet-packages
          path: packages/*/dist/*.tgz

      - name: Publish @hivelet/core
        working-directory: packages/core
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @hivelet/adapter-express
        working-directory: packages/adapter-express
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @hivelet/adapter-nest
        working-directory: packages/adapter-nest
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release tag
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          git tag "v${VERSION}" || true
          git push origin "v${VERSION}" || true